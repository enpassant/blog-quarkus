# Podman Compose: Kafka + MongoDB. Combine with app-dc.yml for the full stack.
x-podman:
  in_pod: false

services:
  kafka:
    image: docker.io/apache/kafka:4.1.2
    hostname: kafka
    # Rootless Podman: let Kafka write the host user's directory without chown.
    userns_mode: keep-id:uid=1000,gid=1000
    user: "1000:1000"
    restart: unless-stopped
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9094}:9094"
    environment:
      CLUSTER_ID: "${KAFKA_CLUSTER_ID:-cWFya3VzLWJsb2cta2Fmaw}"
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INSIDE://0.0.0.0:9092,OUTSIDE://0.0.0.0:9094,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INSIDE://kafka:9092,OUTSIDE://localhost:${KAFKA_PORT:-9094}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INSIDE:PLAINTEXT,OUTSIDE:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INSIDE
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - "${KAFKA_DATA_DIR:-~/kafkadata}:/var/lib/kafka/data:z"
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  mongodb:
    image: "${MONGO_IMAGE:-docker.io/library/mongo:8.2}"
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - "${MONGO_DATA_DIR:-~/mongodbdata}:/data/db:z"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ping: 1}).ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

