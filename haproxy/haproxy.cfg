global
    log stdout format raw local0

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client 60s
    timeout server 60s
    timeout tunnel 1h

resolvers podman_dns
    parse-resolv-conf
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s

frontend http-in
    bind *:8080
    acl blog_path path /blog
    acl blog_path path_beg /blog/
    acl discussion_path path /discussion
    acl discussion_path path_beg /discussion/
    acl monitor_path path /monitor
    acl monitor_path path_beg /monitor/
    use_backend blog_query if blog_path
    use_backend discussion_query if discussion_path
    use_backend monitor if monitor_path
    default_backend web

backend web
    server web web:8081 check resolvers podman_dns init-addr libc,none
backend blog_query
    server blog-query blog-query:8082 check resolvers podman_dns init-addr libc,none
backend discussion_query
    server discussion-query discussion-query:8083 check resolvers podman_dns init-addr libc,none
backend monitor
    server monitor monitor:8084 check resolvers podman_dns init-addr libc,none
