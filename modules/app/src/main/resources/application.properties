quarkus.http.port=8080
quarkus.oidc.enabled=false
quarkus.devservices.enabled=false
blog.title=Rapids Blog
blog.store=file
blog.data-directory=data
blog.kafka.enabled=false
blog.kafka.bootstrap-servers=localhost:${KAFKA_PORT:9094}
blog.mongo.uri=mongodb://localhost:${MONGO_PORT:27017}
blog.mongo.database=blog
blog.mongo.command-database=store
blog.auth.dev-login=false
%dev.blog.auth.dev-login=true
%test.blog.auth.dev-login=true
%test.blog.store=memory
%test.blog.auth.secret=test-secret-at-least-thirty-two-characters
%prod.blog.store=mongo
%prod.blog.kafka.enabled=true
# Set BLOG_AUTH_SECRET for non-OIDC authentication outside dev/test.
%google.quarkus.oidc.enabled=true
%google.quarkus.oidc.provider=google
%google.quarkus.oidc.application-type=web-app
%google.quarkus.oidc.client-id=${GOOGLE_CLIENT_ID}
%google.quarkus.oidc.credentials.secret=${GOOGLE_CLIENT_SECRET}
%google.quarkus.oidc.authentication.redirect-path=/auth/callback
%google.quarkus.http.auth.permission.login.paths=/login
%google.quarkus.http.auth.permission.login.policy=authenticated

blog.registration.base-url=http://localhost:${quarkus.http.port}
