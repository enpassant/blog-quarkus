quarkus.application.name=blog-query-builder
quarkus.http.port=8087
quarkus.devservices.enabled=false
blog.title=Rapids Blog
blog.store=mongo
blog.data-directory=data
blog.mongo.uri=mongodb://localhost:${MONGO_PORT:27017}
blog.mongo.database=blog
blog.mongo.command-database=store
blog.kafka.enabled=true
blog.kafka.bootstrap-servers=localhost:${KAFKA_PORT:9094}
blog.auth.dev-login=false
%dev.blog.auth.dev-login=true
blog.registration.base-url=http://localhost:${quarkus.http.port}
